; Kiln controller firmware for the M5Stack Dial v1.1 (Stamp-S3A, ESP32-S3FN8).

[platformio]
default_envs = m5dial

[env:m5dial]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@0.2.2
    bblanchon/ArduinoJson@7.2.1
; Use the TinyUSB CDC stack instead of the USB-Serial/JTAG peripheral, so a
; host toggling DTR/RTS when it opens the port can never reset the controller.
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
; esptool's DTR/RTS reset doesn't reach TinyUSB firmware; the CDC stack
; instead reboots to the ROM bootloader on a 1200-baud touch (only while the
; heater is disarmed, see main.cpp). The post-upload script then clears the
; sticky force-download flag so the new firmware starts.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
board_upload.after_reset = no_reset
extra_scripts = post:scripts/clear_download_flag.py

; Same firmware with a simulated kiln in place of the thermocouple, for UI
; and desktop-app development. Never drives the SSR pin.
[env:m5dial-sim]
extends = env:m5dial
build_flags =
    ${env:m5dial.build_flags}
    -DKILN_SIMULATE

; Host-side unit tests for lib/kiln_core (needs gcc/g++ on PATH).
[env:native]
platform = native
test_build_src = no
build_flags = -std=c++17
